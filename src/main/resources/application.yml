spring:
  application:
    name: ms-historial-medico

  datasource:
    url: jdbc:mariadb://localhost:3306/db_historial_medico?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
    username: root
    password: 123
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

server:
  port: 8085

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000

logging:
  level:
    com.turnos.historial: DEBUG
    org.springframework.security: DEBUG

feign:
  client:
    ms-pacientes:
      url: http://localhost:8080
    ms-medicos:
      url: http://localhost:8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
